<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- WAJIB UNTUK HP -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PENCET AKU MAS</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#020617;
  color:white;
  text-align:center;
}
#profileBar{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin:10px 0;
}
#profilePic{
  width:50px;
  height:50px;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  border:2px solid #22c55e;
}
#game{
  position:relative;
  height:60vh;
  border-top:2px solid #334155;
  overflow:hidden;
}
.target{
  position:absolute;
  width:60px;
  height:60px;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  cursor:pointer;
}
button{
  padding:8px 16px;
  border:none;
  border-radius:6px;
  background:#22c55e;
  cursor:pointer;
}

/* RESPONSIVE HP */
@media (max-width:600px){
  h1{font-size:22px;}
  #profilePic{width:42px;height:42px;}
  .target{width:52px;height:52px;font-size:26px;}
  button{padding:10px 18px;font-size:16px;}
}

/* MODAL */
#modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.9);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
}
#box{
  background:#020617;
  padding:20px;
  border-radius:12px;
  width:320px;
}
#box input{
  width:90%;
  padding:10px;
  border:none;
  border-radius:6px;
}

/* PROFILE PICKER */
.profileSelect{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  justify-content:center;
}
.profileItem{
  width:80px;
  font-size:11px;
  cursor:pointer;
}
.profileItem .photo{
  width:55px;
  height:55px;
  margin:auto;
  border-radius:50%;
  background-size:cover;
  background-position:center;
  border:2px solid transparent;
}
.profileItem.active .photo{
  border-color:#22c55e;
}

/* GAME OVER */
#gameOver{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.85);
  display:none;
  align-items:center;
  justify-content:center;
  font-size:36px;
  font-weight:bold;
  z-index:10;
}

/* LEADERBOARD */
#leaderboard{
  margin-top:20px;
  border-top:2px solid #334155;
}
ul{list-style:none;padding:0;margin:0}
li{
  display:flex;
  justify-content:space-between;
  padding:8px;
  border-bottom:1px solid #1f2933;
}
.score{color:#22c55e}
</style>
</head>

<body>

<div id="modal">
  <div id="box">
    <h3>Profil Pemain</h3>
    <input id="playerName" placeholder="Nama kamu">
    <div class="profileSelect" id="profileSelect"></div><br>
    <button onclick="confirmPlayer()">LANJUT</button>
  </div>
</div>

<h1>PENCET AKU MAS💦</h1>

<div id="profileBar" style="display:none">
  <div id="profilePic"></div>
  <b id="profileName"></b>
</div>

Score: <b id="score">0</b> | Time: <b id="time">30</b>
<br><br>

<button id="startBtn" onclick="startGame()" disabled>START</button>

<div id="game">
  <div id="gameOver">GAME OVER</div>
</div>

<div id="leaderboard">
  <h2>🏆 LEADERBOARD</h2>
  <ul id="list"></ul>
</div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyCCIri2O15aZDeuuyOae6jUSc_apFaiWc0",
  authDomain:"tap-tap-allstars.firebaseapp.com",
  databaseURL:"https://tap-tap-allstars-default-rtdb.asia-southeast1.firebasedatabase.app"
});

const db=firebase.database();

const images=[
 "https://yappy-orange-hyk5drokv7.edgeone.app/Screenshot_2026-01-30-00-34-17-345-edit_com.miui.gallery.jpg",
 "https://agricultural-blue-2jaxachacj.edgeone.app/IMG_20260130_004634.jpg",
 "https://disturbed-salmon-ktksaoqfb0.edgeone.app/IMG_20260130_003329.jpg",
 "https://socialist-rose-cbbuge11ua.edgeone.app/IMG_20260130_003244.jpg",
 "https://distinctive-white-g8gbjkngts.edgeone.app/IMG_20260130_003146.jpg",
 "https://sufficient-yellow-h9cwdjmb8e.edgeone.app/IMG_20260130_003124.jpg"
];

let player="",profileImg=images[0];
let score=0,timeLeft=20;
let timer,spawn;

/* PROFILE PICKER */
const picker=document.getElementById("profileSelect");
images.forEach((img)=>{
  const d=document.createElement("div");
  d.className="profileItem";
  d.innerHTML=`<div class="photo" style="background-image:url(${img})"></div>`;
  d.onclick=()=>{
    document.querySelectorAll(".profileItem").forEach(x=>x.classList.remove("active"));
    d.classList.add("active");
    profileImg=img;
  };
  picker.appendChild(d);
});
picker.firstChild.classList.add("active");

function confirmPlayer(){
  const name=playerName.value.trim();
  if(!name) return alert("Isi nama dulu");
  player=name;
  profilePic.style.backgroundImage=`url(${profileImg})`;
  profileName.textContent=player;
  modal.style.display="none";
  profileBar.style.display="flex";
  startBtn.disabled=false;
}

function startGame(){
  score=0;
  timeLeft=30;
  scoreEl.textContent=0;
  time.textContent=30;
  gameOver.style.display="none";
  startBtn.disabled=true;

  timer=setInterval(()=>{
    timeLeft--;
    time.textContent=timeLeft;
    if(timeLeft<=0){
      clearInterval(timer);
      clearInterval(spawn);
      startBtn.disabled=false;
      gameOver.style.display="flex";
      saveScore();
    }
  },1000);

  spawn=setInterval(spawnTarget,700);
}

/* ✅ FIX RESPONSIVE POSITION */
function spawnTarget(){

  const t=document.createElement("div");
  t.className="target";

  const r=Math.random();
  if(r<0.15){
    t.textContent="💣";
    t.onclick=()=>{ score=Math.max(0,score-10); updateScore(); t.remove(); };
  }else if(r<0.3){
    t.textContent="⏳";
    t.onclick=()=>{ timeLeft+=5; time.textContent=timeLeft; t.remove(); };
  }else if(r<0.4){
    t.textContent="🗿";
    t.onclick=()=>{ score+=5; updateScore(); t.remove(); };
  }else{
    const img=images[Math.floor(Math.random()*images.length)];
    t.style.backgroundImage=`url(${img})`;
    t.onclick=()=>{ score++; updateScore(); t.remove(); };
  }

  game.appendChild(t);

  const maxX = game.clientWidth - t.offsetWidth;
  const maxY = game.clientHeight - t.offsetHeight;

  t.style.left = Math.random() * maxX + "px";
  t.style.top  = Math.random() * maxY + "px";

  setTimeout(()=>t.remove(),1200);
}

function updateScore(){
  scoreEl.textContent=score;
}

function saveScore(){
  db.ref("leaderboard").push({
    name:player,
    score:score,
    time:Date.now()
  });
}

const list=document.getElementById("list");
const scoreEl=document.getElementById("score");

db.ref("leaderboard")
  .orderByChild("score")
  .limitToLast(1)
  .on("value", snap=>{
    list.innerHTML="";
    const data=[];
    snap.forEach(s=>data.push(s.val()));
    data.reverse();
    data.forEach((d,i)=>{
      let medal="",color="#22c55e";
      if(i==0){medal="🥇";color="#facc15";}
      else if(i==1){medal="🥈";color="#e5e7eb";}
      else if(i==2){medal="🥉";color="#d97706";}
      const li=document.createElement("li");
      li.innerHTML=`
        <span style="color:${color}">${medal} ${d.name}</span>
        <span class="score">${d.score}</span>`;
      list.appendChild(li);
    });
});
</script>

</body>
</html>
